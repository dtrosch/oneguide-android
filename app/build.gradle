plugins {
    id 'com.android.application'
}

android {
    namespace 'com.oneguide.tv'
    compileSdk 34

    defaultConfig {
        applicationId 'com.oneguide.tv'
        minSdk 22
        targetSdk 33
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        debug {
            // A fixed key (committed on purpose: this is a personal debug build, not a store release),
            // so every new build can update the one already installed on the Fire TV.
            storeFile file('oneguide-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
